glance:
  - value: { en: "5 years", pt: "5 anos" }
    label:
      en: "building apps for smart homes and buildings"
      pt: "criando apps para casas e prédios inteligentes"
  - value: { en: "10,000+", pt: "10.000+" }
    label:
      en: "devices connected in the field"
      pt: "aparelhos conectados em campo"
  - value: "−70%"
    label:
      en: "in sales tool costs, with a CRM I built"
      pt: "no custo com ferramentas de vendas, com um CRM que criei"
  - value: { en: "Applied AI", pt: "IA aplicada" }
    label:
      en: "my focus for the past year"
      pt: "meu foco no último ano"
summary:
  en: >-
    For 5 years I've built home and building automation apps: panels with 1 GB of RAM, apps that
    keep working without internet, and a platform with more than 10,000 devices in the field. For
    the past year I've focused on applied AI, connecting language models and agents to real
    products. I came from Agricultural Engineering and project management, so I design software
    starting from the process, not the code.
  pt: >-
    Há 5 anos crio apps de automação residencial e predial: painéis com 1 GB de RAM, apps que
    seguem funcionando sem internet e uma plataforma com mais de 10.000 aparelhos em campo. No
    último ano, meu foco é IA aplicada: ligar modelos de linguagem e agentes a produtos reais. Vim
    da Engenharia Agrícola e da gestão de projetos, por isso começo pelo processo, não pelo código.
