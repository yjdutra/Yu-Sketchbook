name: PokéDex Arena
tagline:
  en: "All 1,025 Pokémon in one place, plus a 6-on-6 battle that plays by the real rules."
  pt: "As 1025 espécies de Pokémon num lugar só, mais uma batalha 6×6 com as regras de verdade."
