    Batalha de Pokémon esconde uma quantidade absurda de conta, e eu quis acertar cada uma delas.
    As regras moram num arquivo só, sem tela nenhuma por perto.
repo: https://github.com/yjdutra/pokedex-arena
liveUrl: https://yjdutra.github.io/pokedex-arena/
stack:
  - React
  - TypeScript
  - Vite
  - PokéAPI
